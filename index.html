<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FitCoach AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── Camera view ─────────────────────────────────── -->
<div id="camera-view">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>

  <!-- Top stats -->
  <div id="stats-bar">
    <div id="rep-block">
      <span id="rep-count">0</span>
      <span class="rep-label">REPS</span>
    </div>
    <span id="exercise-name">—</span>
    <div id="status-area">
      <span id="form-score">—</span>
      <span id="status-dot"></span>
    </div>
  </div>

  <!-- AI feedback text -->
  <div id="feedback-area">
    <div id="feedback-text"></div>
    <div id="phase-indicator"></div>
  </div>

  <!-- Controls -->
  <div id="controls">
    <button id="settings-btn" class="ctrl" title="Settings">⚙️</button>
    <button id="start-btn"    class="ctrl" title="Start / Stop">▶</button>
    <button id="flip-btn"     class="ctrl" title="Flip camera">🔄</button>
  </div>
</div>

<!-- ── Settings panel ─────────────────────────────── -->
<div id="settings-panel">
  <div class="panel-header">
    <h2>Settings</h2>
    <button id="close-settings">✕</button>
  </div>

  <div class="panel-body">

    <!-- Exercise -->
    <div>
      <p class="section-title">Exercise</p>
      <div class="field">
        <select id="exercise-select">
          <!-- populated by app.js -->
        </select>
      </div>
    </div>

    <!-- AI model -->
    <div>
      <p class="section-title">AI Model (via OpenRouter)</p>
      <div class="field">
        <select id="model-select">
          <option value="google/gemini-flash-1.5">Gemini Flash 1.5 — fast &amp; cheap</option>
          <option value="google/gemini-2.0-flash-001">Gemini 2.0 Flash</option>
          <option value="meta-llama/llama-3.1-8b-instruct">Llama 3.1 8B — fastest</option>
          <option value="anthropic/claude-haiku-4-5">Claude Haiku 4.5</option>
          <option value="anthropic/claude-sonnet-4-5">Claude Sonnet 4.5</option>
          <option value="openai/gpt-4o-mini">GPT-4o Mini</option>
        </select>
      </div>
    </div>

    <!-- API keys -->
    <div>
      <p class="section-title">API Keys</p>
      <div class="field">
        <label for="inp-or-key">OpenRouter key <span style="color:#ff4500">*</span></label>
        <input type="password" id="inp-or-key" placeholder="sk-or-...">
      </div>
      <div class="field" style="margin-top:10px">
        <label for="inp-el-key">ElevenLabs key (voice feedback)</label>
        <input type="password" id="inp-el-key" placeholder="Leave blank to disable voice">
      </div>
      <div class="field" style="margin-top:10px">
        <label for="inp-el-voice">ElevenLabs Voice ID</label>
        <input type="text" id="inp-el-voice" placeholder="Default: Adam">
        <small>Find IDs at elevenlabs.io/voice-library</small>
      </div>
    </div>

    <!-- Coach options -->
    <div>
      <p class="section-title">Coach Options</p>
      <div class="toggle-row" style="margin-bottom:12px">
        <label>Voice feedback</label>
        <input type="checkbox" id="voice-toggle" checked>
      </div>
      <div class="field">
        <label>AI feedback every</label>
        <div class="range-row">
          <input type="range" id="feedback-interval" min="2" max="20" value="4">
          <span id="interval-val">4s</span>
        </div>
      </div>
    </div>

    <button class="btn-primary" id="save-settings">Save &amp; Close</button>
    <button class="btn-secondary" id="reset-reps">Reset Rep Count</button>

    <p style="font-size:.72rem;color:#555;text-align:center;line-height:1.5">
      Keys stored in browser localStorage only.<br>
      Camera requires HTTPS or localhost.
    </p>
  </div>
</div>

<!-- ── Loading ─────────────────────────────────────── -->
<div id="loading-overlay">
  <div class="spinner"></div>
  <p id="loading-msg">Loading AI model…</p>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
